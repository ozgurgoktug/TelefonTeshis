name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash

      - name: Hata ozeti
        if: failure()
        shell: bash
        run: |
          MSG=$(grep -E '^e: |error:|What went wrong|Execution failed|Could not' build.log | head -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Derleme hatasi::$MSG"

      - uses: actions/upload-artifact@v4
        with:
          name: telefon-teshis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
